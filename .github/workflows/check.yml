# Full gate on every pull request and on main: format, lint, typecheck, unit
# tests, generated-types drift, and Playwright e2e.
#
# Convex runs as an anonymous local backend (no Convex account). Clerk needs a
# real dev instance: add these repository secrets to enable e2e —
#   CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY (pk_test_/sk_test_ only)
#   CLERK_JWT_ISSUER_DOMAIN  (Issuer URL of the Clerk JWT template `convex`)
#   E2E_CLERK_USER_EMAIL     (optional; enables the signed-in project)
# Without Clerk secrets the e2e step is skipped with a warning; everything
# else still runs.
#
# Token scope: https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
# Checkout credentials: https://github.com/actions/checkout#usage
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONVEX_AGENT_MODE: anonymous
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `convex dev --once` downloads a ~200 MB local backend binary.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: convex-local-backend-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Recipe from `npx convex init --help`: init (writes .env.local, no push)
      # → env set → dev. `convex/auth.config.ts` reads the variable at push time.
      - name: Configure the anonymous Convex deployment
        run: |
          pnpm exec convex init
          pnpm exec convex env set CLERK_JWT_ISSUER_DOMAIN "${CLERK_JWT_ISSUER_DOMAIN:-https://placeholder.clerk.accounts.dev}"
        env:
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_JWT_ISSUER_DOMAIN }}
      - run: pnpm check:core
      # playwright.config.ts throws unless both Clerk keys exist.
      - name: Install Playwright browsers
        if: env.CLERK_SECRET_KEY != '' && env.CLERK_PUBLISHABLE_KEY != ''
        run: pnpm exec playwright install chromium --with-deps
      - name: Playwright e2e
        if: env.CLERK_SECRET_KEY != '' && env.CLERK_PUBLISHABLE_KEY != ''
        run: pnpm test:e2e
      - name: Playwright e2e skipped
        if: env.CLERK_SECRET_KEY == '' || env.CLERK_PUBLISHABLE_KEY == ''
        run: echo "::warning::Playwright e2e skipped. Add CLERK_PUBLISHABLE_KEY and CLERK_SECRET_KEY repository secrets to enable it."
      - uses: actions/upload-artifact@v4
        if: failure() && env.CLERK_SECRET_KEY != '' && env.CLERK_PUBLISHABLE_KEY != ''
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
